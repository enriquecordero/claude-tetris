<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="gameover-extra" class="gameover-extra hidden">
          <p id="overlay-stats" class="records-stats"></p>

          <div id="save-record" class="save-record hidden">
            <label class="records-label" for="record-name">¡Nuevo record! Escribe tu nombre</label>
            <div class="save-record-row">
              <input id="record-name" type="text" maxlength="10" autocomplete="off" spellcheck="false" placeholder="Anónimo" />
              <button id="save-record-btn">Guardar</button>
            </div>
          </div>

          <div id="overlay-records" class="records"></div>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="start-screen">
      <div class="start-box">
        <p class="start-title">RECORDS</p>
        <div id="start-records" class="records"></div>
        <p id="start-stats" class="records-stats"></p>
        <button id="play-btn">JUGAR</button>
        <button id="clear-records-btn" class="btn-secondary">Borrar records</button>
        <div id="clear-confirm" class="clear-confirm hidden">
          <span>¿Seguro que quieres borrar todos los records?</span>
          <div class="clear-confirm-row">
            <button id="clear-yes" class="btn-danger">Sí, borrar</button>
            <button id="clear-no" class="btn-secondary">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
